
input {
  beats {
    port => 5044
  }
}



filter {
  if [event][dataset] == "api.health_check" {
    # Filebeat already parses each JSON line.
    # Keep health-check events as structured JSON.

  } else if [container][name] =~ /flask/ {
    mutate {
      add_field => { "service.name" => "flask" }
    }

    grok {
      match => {
        "message" => '%{IPORHOST:client_ip} - %{DATA:remote_user} \[%{HTTPDATE:nginx_timestamp}\] "%{WORD:http_method} %{DATA:request_target} HTTP/%{NUMBER:http_version}" %{NUMBER:http_status:int} (?:%{NUMBER:body_bytes_sent:int}|-) "%{DATA:http_referer}" "%{DATA:user_agent}"'
      }
      tag_on_failure => ["_flask_grok_failure"]
    }

    if [nginx_timestamp] {
      date {
        match => ["nginx_timestamp", "dd/MMM/yyyy:HH:mm:ss Z"]
        target => "@timestamp"
      }
    }

  } else if [container][name] =~ /nginx/ {
    mutate {
      add_field => { "service.name" => "nginx" }
    }

    grok {
      match => {
        "message" => '%{IPORHOST:client_ip} - %{DATA:remote_user} \[%{HTTPDATE:nginx_timestamp}\] "%{WORD:http_method} %{DATA:request_target} HTTP/%{NUMBER:http_version}" %{NUMBER:http_status:int} (?:%{NUMBER:body_bytes_sent:int}|-) "%{DATA:http_referer}" "%{DATA:user_agent}"'
      }
      tag_on_failure => ["_nginx_grok_failure"]
    }

    if [nginx_timestamp] {
      date {
        match => ["nginx_timestamp", "dd/MMM/yyyy:HH:mm:ss Z"]
        target => "@timestamp"
      }
    }

  } else {
    drop {}
  }
}


output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "flask-nginx-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}
