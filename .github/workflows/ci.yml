name: CI


on:
    push:
    pull_request:


jobs:
    test:
        runs-on: ubuntu-latest


        env:
            DB_PASSWORD: ci-test-password
            DB_NAME: store
            TEST_DB_NAME: store_test

        steps:
          - name: Check out repository
            uses: actions/checkout@v6


          - name: Run tests
            run: docker compose run --build --rm flask-test

