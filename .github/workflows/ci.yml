
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    env:
      DB_PASSWORD: ci-test-password
      DB_NAME: store
      TEST_DB_NAME: store_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run tests
        run: docker compose run --rm --build flask-test

  build:
    name: Build runtime image
    needs: test
    runs-on: ubuntu-latest

    env:
      DB_PASSWORD: ci-test-password
      DB_NAME: store

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build runtime image
        run: docker build -t bacharidocker/flask-product-api:ci ./flask

      - name: Verify runtime user
        run: |
          test "$(docker run --rm bacharidocker/flask-product-api:ci whoami)" = "appuser"

      - name: Verify Gunicorn is installed
        run: docker run --rm bacharidocker/flask-product-api:ci gunicorn --version

      - name: Start MySQL
        run: docker compose up -d mysql

      - name: Wait for MySQL to become healthy
        run: |
          for _ in {1..30}; do
            STATUS=$(docker inspect \
              --format='{{.State.Health.Status}}' \
              "$(docker compose ps -q mysql)" 2>/dev/null || true)

            echo "MySQL health: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              exit 0
            fi

            sleep 2
          done

          echo "MySQL did not become healthy"
          docker compose logs mysql
          exit 1

      - name: Start Flask application
        run: |
          MYSQL_NETWORK=$(docker inspect \
            --format='{{range $name, $network := .NetworkSettings.Networks}}{{$name}}{{end}}' \
            "$(docker compose ps -q mysql)")

          docker run -d \
            --name flask-ci \
            --network "$MYSQL_NETWORK" \
            -e DB_HOST=mysql \
            -e DB_NAME=store \
            -e DB_USER=root \
            -e DB_PASSWORD=ci-test-password \
            -p 5001:5000 \
            bacharidocker/flask-product-api:ci

      - name: Wait for Flask application
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:5001/api/hello > /dev/null; then
              echo "Flask application is responding"
              exit 0
            fi

            echo "Waiting for Flask application...($i/30)"
            sleep 2
          done

          echo "Flask application did not start"
          echo "Flask logs:"
          docker logs flask-ci
          echo "MySQL logs:"
          docker compose logs mysql
          exit 1

      - name: Test products endpoint
        run: |
          curl --fail --silent http://localhost:5001/api/products

      - name: Show Flask logs
        if: always()
        run: |
          docker logs flask-ci || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f flask-ci || true
          docker compose down -v || true

  deploy-test:
    name: Test Ansible connectivity
    needs: build

    # Only trusted pushes to devops-learning.
    # Never run on pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/devops-learning'

    runs-on: [self-hosted, linux, x64, lan-deploy]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Test Ansible connection
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          set -e

          umask 077
          VAULT_PASSWORD_FILE=$(mktemp)

          trap 'rm -f "$VAULT_PASSWORD_FILE"' EXIT

          if [ -z "$ANSIBLE_VAULT_PASSWORD" ]; then
            echo "Ansible Vault password is missing"
            exit 1
          fi

          printf '%s' "$ANSIBLE_VAULT_PASSWORD" > "$VAULT_PASSWORD_FILE"

          echo "Testing Ansible connectivity..."

          ansible \
            -i ansible/inventory.ini \
            flask_servers \
            -m ping \
            --vault-password-file "$VAULT_PASSWORD_FILE"


      - name: Run Ansible server diagnostics
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          set -e

          umask 077
          VAULT_PASSWORD_FILE=$(mktemp)
          trap 'rm -f "$VAULT_PASSWORD_FILE"' EXIT

          if [ -z "$ANSIBLE_VAULT_PASSWORD" ]; then
            echo "Ansible Vault password is missing"
            exit 1
          fi

          printf '%s' "$ANSIBLE_VAULT_PASSWORD" > "$VAULT_PASSWORD_FILE"

          echo "Running server diagnostics..."

          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/14_server_diagnostics.yml \
            --vault-password-file "$VAULT_PASSWORD_FILE"

  publish:
    name: Publish Docker image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./flask
          push: true
          tags: bacharidocker/flask-product-api:${{ github.ref_name }}

  deploy:
    name: Deploy with Ansible
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, linux, x64, lan-deploy]

    concurrency:
      group: production-deployment
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare deployment credentials
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          ANSIBLE_BECOME_PASSWORD: ${{ secrets.ANSIBLE_BECOME_PASSWORD }}
          ANSIBLE_TLS_PRIVATE_KEY: ${{ secrets.ANSIBLE_TLS_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077

          # Validate secrets before creating temporary files.
          test -n "$ANSIBLE_VAULT_PASSWORD" || {
            echo "Ansible Vault password is missing"
            exit 1
          }

          test -n "$ANSIBLE_BECOME_PASSWORD" || {
            echo "Ansible become password is missing"
            exit 1
          }

          test -n "$ANSIBLE_TLS_PRIVATE_KEY" || {
            echo "TLS private key is missing"
            exit 1
          }

          # Create a private temporary directory on the runner.
          DEPLOY_TMP_DIR=$(mktemp -d)
          echo "DEPLOY_TMP_DIR=$DEPLOY_TMP_DIR" >> "$GITHUB_ENV"

          # Create the two Ansible password files.
          printf '%s' "$ANSIBLE_VAULT_PASSWORD" \
            > "$DEPLOY_TMP_DIR/vault-password"

          printf '%s' "$ANSIBLE_BECOME_PASSWORD" \
            > "$DEPLOY_TMP_DIR/become-password"

          # Prepare the TLS private key for the Ansible copy task.
          mkdir -p nginx/certs

          printf '%s\n' "$ANSIBLE_TLS_PRIVATE_KEY" \
            > nginx/certs/localhost.key

          chmod 600 "$DEPLOY_TMP_DIR/vault-password"
          chmod 600 "$DEPLOY_TMP_DIR/become-password"
          chmod 600 nginx/certs/localhost.key

          echo "Deployment credentials prepared."

      - name: Deploy application with Ansible
        env:
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/15_production_deploy.yml \
            --vault-password-file "$DEPLOY_TMP_DIR/vault-password" \
            --become-password-file "$DEPLOY_TMP_DIR/become-password" \
            -e "app_image_tag=$IMAGE_TAG"

      - name: Verify deployed image
        env:
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # IMAGE_TAG expands on the runner; command substitution runs remotely.
          # shellcheck disable=SC2029
          RUNNING_IMAGE=$(ssh production-lab \
            "docker inspect \
            \$(IMAGE_TAG='$IMAGE_TAG' docker compose \
            --env-file /opt/flask-product-api/.env \
            -f /opt/flask-product-api/compose.production.yml \
            ps -q flask) \
            --format '{{.Config.Image}}'")

          EXPECTED_IMAGE="bacharidocker/flask-product-api:${IMAGE_TAG}"

          echo "Expected image: $EXPECTED_IMAGE"
          echo "Running image:  $RUNNING_IMAGE"

          test "$RUNNING_IMAGE" = "$EXPECTED_IMAGE"

      - name: Cleanup deployment credentials
        if: always()
        run: |
          set +e

          rm -f nginx/certs/localhost.key

          if [ -n "${DEPLOY_TMP_DIR:-}" ]; then
            rm -rf "$DEPLOY_TMP_DIR"
          fi

          echo "Deployment credential cleanup finished."
