name: CI


on:
    push:
    pull_request:


permissions:
    contents: read


jobs:
    test:
        name: Run tests
        runs-on: ubuntu-latest


        env:
            DB_PASSWORD: ci-test-password
            DB_NAME: store
            TEST_DB_NAME: store_test

        steps:
          - name: Check out repository
            uses: actions/checkout@v6


          - name: Run tests
            run: docker compose run --rm --build flask-test


    build:
        name: Build runtime image
        needs: test
        runs-on: ubuntu-latest


        env:
            DB_PASSWORD: ci-test-password
            DB_NAME: store


        steps:
          - name: Check out repository
            uses: actions/checkout@v6


          - name: Build runtime image
            run: docker build -t bacharidocker/flask-product-api:ci ./flask



          - name: Verify runtime user
            run: |
                test "$(docker run --rm bacharidocker/flask-product-api:ci whoami)" = "appuser"


          - name: Verify Gunicorn is installed
            run: docker run --rm bacharidocker/flask-product-api:ci gunicorn  --version


          - name: Start MySQL
            run: |
                docker compose up -d mysql

          - name: Wait for MySQL to become healthy
            run: |

                for i in {1..30}; do
                    STATUS=$(docker inspect \
                        --format='{{.State.Health.Status}}' \
                        "$(docker compose ps -q mysql)" 2>/dev/null || true)

                    echo "MySQL health: $STATUS"

                    if [ "$STATUS" = "healthy" ]; then
                        exit 0
                    fi


                    sleep 2
                done

                echo "MySQL did not become healthy"
                docker compose logs mysql
                exit 1



          - name: Start Flask application
            run: |
                MYSQL_NETWORK=$(docker inspect \
                    --format='{{range $name, $network := .NetworkSettings.Networks}}{{$name}}{{end}}' \
                    "$(docker compose ps -q mysql)")

                docker run -d \
                    --name flask-ci \
                    --network "$MYSQL_NETWORK" \
                    -e DB_HOST=mysql \
                    -e DB_NAME=store \
                    -e DB_USER=root \
                    -e DB_PASSWORD=ci-test-password \
                    -p 5001:5000 \
                    bacharidocker/flask-product-api:ci




          - name: Wait for Flask application
            run: |
                for i in {1..30}; do
                    if curl --fail --silent http://localhost:5001/api/hello > /dev/null; then
                        echo "Flask application is responding"
                        exit 0
                    fi

                    echo "Waiting for Flask application..."
                    sleep 2
                done

                echo "Flask application did not start"
                docker logs flask-ci
                exit 1


          - name: Test products endpoint
            run: |
                curl --fail --silent http://localhost:5001/api/products


          - name: Show Flask logs
            if: always()
            run: |
                docker logs flask-ci || true


          - name: Cleanup
            if: always()
            run: |
                docker rm -f flask-ci || true
                docker compose down -v || true



    deploy-test:
        name: Test production SSH
        needs: build
        runs-on: [self-hosted, linux, x64, lan-deploy]


        steps:
          - name: Test production SSH
            run: |
                ssh production-lab "whoami && hostname && docker ps"




    publish:
        name: Publish Docker image
        if: startsWith(github.ref, 'refs/tags/v')
        needs: build
        runs-on: ubuntu-latest

        permissions:
            contents: read


        steps:
          - name: Check out repository
            uses: actions/checkout@v6

          - name: Log in to Docker Hub
            uses: docker/login-action@v4
            with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}


          - name: Build and push Docker image
            uses: docker/build-push-action@v7
            with:
                context: ./flask
                push: true
                tags: bacharidocker/flask-product-api:${{ github.ref_name }}





    deploy:
        name: Deploy to production
        needs: publish
        runs-on: [self-hosted, linux, x64, lan-deploy]

        steps:
          - name: Check out repository
            uses: actions/checkout@v6

          - name: Copy production configuration
            run: |
                scp compose.production.yml deploy.sh production-lab:/opt/flask-product-api/

          - name: Deploy to production
            run: |
                ssh production-lab \
                    "cd /opt/flask-product-api && chmod +x ./deploy.sh && ./deploy.sh ${{ github.ref_name }}"

