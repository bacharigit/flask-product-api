name: CI


on:
    push:
    pull_request:


permissions:
    contents: read


jobs:
    test:
        name: Run tests
        runs-on: ubuntu-latest


        env:
            DB_PASSWORD: ci-test-password
            DB_NAME: store
            TEST_DB_NAME: store_test

        steps:
          - name: Check out repository
            uses: actions/checkout@v6


          - name: Run tests
            run: docker compose run --rm --build flask-test


    build:
        name: Build runtime image
        needs: test
        runs-on: ubuntu-latest


        steps:
          - name: Check out repository
            uses: actions/checkout@v6


          - name: Build runtime image
            run: docker build -t flask-product-api:ci ./flask



          - name: Verify runtime user
            run: |
                test "$(docker run --rm flask-product-api:ci whoami)" = "appuser"


          - name: Verify Gunicorn
            run: docker run --rm flask-product-api:ci gunicorn --version



