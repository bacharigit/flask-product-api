name: Self-hosted Runner Test

on:
  workflow_dispatch:


jobs:

  test-runner:
    runs-on: [self-hosted, linux, x64, lan-deploy]

    steps:
      - name: Show version
        run: echo "Deploying ${{ inputs.version }}"

      - name: Show runner information
        run: |
          echo "Hostname:"
          hostname

          echo "IP addresses:"
          hostname -I

          echo "User:"
          whoami

          echo "Architecture:"
          uname -m
