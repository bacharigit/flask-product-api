name: Self-hosted Runner Test

on:
  push:
    branches:
      - devops-learning

jobs:
  test-runner:
    runs-on: [self-hosted, linux, x64, lan-deploy]

    steps:
      - name: Show runner information
        run: |
          echo "Hostname:"
          hostname

          echo "IP addresses:"
          hostname -I

          echo "User:"
          whoami

          echo "Architecture:"
          uname -m

          echo "the test is completed now"
