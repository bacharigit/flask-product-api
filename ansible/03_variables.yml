---
- name: Learn Ansible Variables
  hosts: flask_servers
  gather_facts: true

  vars:
    app_name: flask-product-api
    app_directory: /opt/flask-product-api
    app_environment: learning
    app_port: 5000

  tasks:
    - name: Display application name
      ansible.builtin.debug:
        msg: "Application name: {{ app_name }}"

    - name: Display application directory
      ansible.builtin.debug:
        msg: "Application directory: {{ app_directory }}"

    - name: Display application environment
      ansible.builtin.debug:
        msg: "Application environment: {{ app_environment }}"

    - name: Display application port
      ansible.builtin.debug:
        msg: "Application port: {{ app_port }}"

