services:

    flask:
        image: bacharidocker/flask-product-api:${IMAGE_TAG}
        expose:
          - "5000"

        depends_on:
            mysql:
                condition: service_healthy

        environment:
            DB_HOST: mysql
            DB_NAME: ${DB_NAME}
            DB_USER: root
            DB_PASSWORD: ${DB_PASSWORD}



        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/hello', timeout=3)"]
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 20s

        restart: unless-stopped


    mysql:
        image: mysql:8.0

        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_DATABASE: ${DB_NAME}

        volumes:
          - mysql-data:/var/lib/mysql

        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
            interval: 5s
            timeout: 5s
            retries: 20

        restart: unless-stopped



    nginx:
        image: nginx:alpine
        ports:
          - "8080:80"
          - "8443:443"
        volumes:
          - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
          - ./nginx/certs:/etc/nginx/certs:ro
        depends_on:
            flask:
                condition: service_healthy

        restart: unless-stopped


volumes:
  mysql-data:

