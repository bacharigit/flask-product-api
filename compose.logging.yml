
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:9.2.3
    depends_on:
      - elasticsearch
    ports:
      - "127.0.0.1:5044:5044"
    volumes:
      - ./logging/logstash/pipeline:/usr/share/logstash/pipeline:ro
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:9.2.3
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: "${KIBANA_ENCRYPTED_SAVED_OBJECTS_KEY:?Set this variable in your .env file}"
    ports:
      - "127.0.0.1:5601:5601"
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:9.2.3
    user: root
    depends_on:
      - logstash
    command: ["--strict.perms=false"]
    volumes:
      - ./logging/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./monitoring:/usr/share/filebeat/monitoring:ro
      - filebeat-data:/usr/share/filebeat/data
    restart: unless-stopped

volumes:
  elasticsearch-data:
  filebeat-data:
